[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["dependencies"]
optimizer = true
optimizer_runs = 200
# Whitechain testnet (op-reth) headers carry Prague fields (requestsHash), checked 2026-11-06.
evm_version = "prague"
solc_version = "0.8.30"

fs_permissions = [{ access = "write", path = "../packages/shared/deployments.json" }]

[dependencies]
forge-std = "1.17.0"
"@openzeppelin-contracts" = "5.7.0"

[soldeer]
remappings_generate = false
recursive_deps = false

[rpc_endpoints]
whitechain = "${WC_RPC_URL}"

# Blockscout verification (C1): forge verify-contract --verifier blockscout --verifier-url https://explorer.testnet.whitechain.io/api/
